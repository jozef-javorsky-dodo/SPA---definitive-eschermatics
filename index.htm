    <script type="module">
      "use strict";
      class Sanitizer {
        static number(val, min, max, fallback) {
          const n = parseFloat(val);
          return Number.isFinite(n)
            ? Math.min(Math.max(n, min), max)
            : fallback;
        }
        static int(val, min, max, fallback) {
          const n = parseInt(val, 10);
          return Number.isFinite(n)
            ? Math.min(Math.max(n, min), max)
            : fallback;
        }
        static string(val, allowed, fallback) {
          return allowed.includes(val) ? val : fallback;
        }
      }
      class BaseVisualization {
        constructor(ctx, width, height, palette) {
          this.ctx = ctx;
          this.width = width;
          this.height = height;
          this.palette = palette;
          this.time = 0;
        }
        setDimensions(w, h) {
          this.width = w;
          this.height = h;
        }
        update(dt) {
          this.time += dt;
        }
        render() {
          this.ctx.fillStyle = this.palette.bg;
          this.ctx.fillRect(0, 0, this.width, this.height);
        }
      }
      class PenroseTiling extends BaseVisualization {
        constructor(ctx, width, height, palette, iterations) {
          super(ctx, width, height, palette);
          this.iterations = iterations;
          this.phi = (1 + Math.sqrt(5)) / 2;
          this.tiles = [];
          this.generate();
        }
        setDimensions(w, h) {
          super.setDimensions(w, h);
          this.generate();
        }
        generate() {
          const size =
            Math.min(this.width, this.height) / (2.5 + this.iterations * 0.4);
          let current = [];
          for (let i = 0; i < 5; i++) {
            const angle = ((Math.PI * 2) / 5) * i;
            current.push({
              x: this.width / 2,
              y: this.height / 2,
              size,
              angle,
              type: "kite",
            });
          }
          for (let i = 0; i < this.iterations; i++) {
            current = this.subdivide(current);
          }
          this.tiles = current;
        }
        subdivide(tiles) {
          const next = [];
          const r = 1 / this.phi;
          for (const t of tiles) {
            const { x, y, size, angle, type } = t;
            const ns = size * r;
            const a72 = (Math.PI * 2) / 5;
            const a36 = Math.PI / 5;
            if (type === "kite") {
              const pA = {
                x: x + size * Math.cos(angle + a72),
                y: y + size * Math.sin(angle + a72),
              };
              const pB = {
                x: x + size * Math.cos(angle - a72),
                y: y + size * Math.sin(angle - a72),
              };
              next.push({ x, y, size: ns, angle: angle + a36, type: "kite" });
              next.push({
                x: pA.x,
                y: pA.y,
                size: ns,
                angle: angle + a72 + Math.PI - a36,
                type: "kite",
              });
              next.push({ x, y, size: ns, angle: angle - a36, type: "dart" });
              next.push({
                x: pB.x,
                y: pB.y,
                size: ns,
                angle: angle - a72 + Math.PI,
                type: "dart",
              });
            } else {
              const pA = {
                x: x + size * Math.cos(angle),
                y: y + size * Math.sin(angle),
              };
              next.push({
                x,
                y,
                size: ns,
                angle: angle + a72 * 2,
                type: "kite",
              });
              next.push({
                x: pA.x,
                y: pA.y,
                size: ns,
                angle: angle + Math.PI - a36,
                type: "dart",
              });
            }
          }
          return next;
        }
        render() {
          super.render();
          this.ctx.lineWidth = 0.5;
          for (const t of this.tiles) {
            this.ctx.save();
            this.ctx.translate(t.x, t.y);
            this.ctx.rotate(t.angle + this.time * 0.05);
            this.ctx.beginPath();
            const s = t.size;
            const d = s / this.phi;
            const a72 = (Math.PI * 2) / 5;
            const a36 = Math.PI / 5;
            if (t.type === "kite") {
              this.ctx.moveTo(0, 0);
              this.ctx.lineTo(s, 0);
              this.ctx.lineTo(d * Math.cos(a36), d * Math.sin(a36));
              this.ctx.lineTo(s * Math.cos(a72), s * Math.sin(a72));
            } else {
              this.ctx.moveTo(0, 0);
              this.ctx.lineTo(d, 0);
              this.ctx.lineTo(s * Math.cos(a36), s * Math.sin(a36));
              this.ctx.lineTo(d * Math.cos(a72), d * Math.sin(a72));
            }
            this.ctx.closePath();
            this.ctx.fillStyle =
              t.type === "kite" ? this.palette.c1 : this.palette.c2;
            this.ctx.strokeStyle = this.palette.accent;
            this.ctx.fill();
            this.ctx.stroke();
            this.ctx.restore();
          }
        }
      }
      class EscherPattern extends BaseVisualization {
        constructor(ctx, width, height, palette, iterations, type, param) {
          super(ctx, width, height, palette);
          this.iterations = iterations;
          this.type = type;
          this.param = param;
        }
        render() {
          super.render();
          const cells = 4 + this.iterations * 2;
          const diag = Math.sqrt(this.width ** 2 + this.height ** 2);
          const size = diag / (cells * 1.5);
          this.ctx.save();
          this.ctx.translate(this.width / 2, this.height / 2);
          this.ctx.rotate(this.time * 0.1);
          for (let i = -cells; i <= cells; i++) {
            for (let j = -cells; j <= cells; j++) {
              const x = i * size * (1 + this.param * 0.1);
              const y = j * size * (1 + this.param * 0.1);
              this.drawMotif(x, y, size);
              this.ctx.fillStyle = [
                this.palette.c1,
                this.palette.c2,
                this.palette.c3,
              ][Math.abs(i + j) % 3];
              this.ctx.fill();
            }
          }
          this.ctx.restore();
        }
        drawMotif(x, y, s) {
          this.ctx.beginPath();
          const sides = (this.type % 4) + 3;
          for (let k = 0; k < sides; k++) {
            const a = ((Math.PI * 2) / sides) * k;
            const r = s * 0.5 * (1 + this.param * Math.sin(a * 3 + this.time));
            const px = x + r * Math.cos(a);
            const py = y + r * Math.sin(a);
            if (k === 0) this.ctx.moveTo(px, py);
            else this.ctx.lineTo(px, py);
          }
          this.ctx.closePath();
        }
      }
      class Engine {
        constructor() {
          this.canvas = document.getElementById("visualizationCanvas");
          this.ctx = this.canvas.getContext("2d", {
            alpha: false,
            desynchronized: true,
            willReadFrequently: false,
          });
          this.announcer = document.getElementById("a11y-announcer");
          this.vis = null;
          this.active = false;
          this.lastTime = performance.now();
          this.animFrame = null;
          this.palettes = Object.freeze({
            grayscale_contrast: Object.freeze({
              bg: "#e0e0e0",
              c1: "#212121",
              c2: "#616161",
              c3: "#9e9e9e",
              accent: "#000000",
            }),
            vibrant_sunrise: Object.freeze({
              bg: "#fff3e0",
              c1: "#ff7043",
              c2: "#ffca28",
              c3: "#ffee58",
              accent: "#f4511e",
            }),
            deep_ocean: Object.freeze({
              bg: "#001f3f",
              c1: "#0074d9",
              c2: "#7fdbff",
              c3: "#39cccc",
              accent: "#b10dc9",
            }),
            earthy_harmony: Object.freeze({
              bg: "#f5f5dc",
              c1: "#a0522d",
              c2: "#d2b48c",
              c3: "#8fbc8f",
              accent: "#556b2f",
            }),
            forest_canopy: Object.freeze({
              bg: "#e8f5e9",
              c1: "#388e3c",
              c2: "#81c784",
              c3: "#a5d6a7",
              accent: "#1b5e20",
            }),
            synthwave_neon: Object.freeze({
              bg: "#1a1a2e",
              c1: "#e94560",
              c2: "#0f3460",
              c3: "#533483",
              accent: "#f0a500",
            }),
            default: Object.freeze({
              bg: "#edf2f7",
              c1: "#4299e1",
              c2: "#63b3ed",
              c3: "#90cdf4",
              accent: "#2b6cb0",
            }),
          });
          this.setupEvents();
          const rect = this.canvas.parentElement.getBoundingClientRect();
          this.resize(rect.width, rect.height);
          this.setVis("penrose");
          this.sync();
          document.getElementById("currentYear").textContent = new Date()
            .getFullYear()
            .toString();
          const loader = document.getElementById("loadingOverlay");
          loader.style.opacity = "0";
          setTimeout(() => {
            loader.style.visibility = "hidden";
            loader.setAttribute("aria-busy", "false");
          }, 400);
        }
        getPalette(name) {
          const safeName = Sanitizer.string(
            name,
            Object.keys(this.palettes),
            "default",
          );
          return this.palettes[safeName];
        }
        setupEvents() {
          this.observer = new ResizeObserver((entries) => {
            requestAnimationFrame(() => {
              if (!Array.isArray(entries) || !entries.length) return;
              const entry = entries[0];
              this.resize(entry.contentRect.width, entry.contentRect.height);
            });
          });
          this.observer.observe(this.canvas.parentElement);
          document
            .getElementById("btnPenrose")
            .addEventListener("click", () => this.setVis("penrose"));
          document
            .getElementById("btnEscher")
            .addEventListener("click", () => this.setVis("escher"));
          document
            .getElementById("btnAnimate")
            .addEventListener("click", () => this.toggleAnimate());
          document.querySelectorAll("input, select").forEach((el) => {
            el.addEventListener("input", () => this.sync());
          });
        }
        resize(w, h) {
          const dpr = window.devicePixelRatio || 1;
          this.canvas.width = w * dpr;
          this.canvas.height = h * dpr;
          this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          if (this.vis) {
            this.vis.setDimensions(w, h);
          }
          this.render();
        }
        setVis(type) {
          const p = this.getPalette(
            document.getElementById("colorSchemeControl").value,
          );
          const it = Sanitizer.int(
            document.getElementById("iterationsControl").value,
            0,
            5,
            3,
          );
          const rect = this.canvas.parentElement.getBoundingClientRect();
          if (type === "penrose") {
            this.vis = new PenroseTiling(
              this.ctx,
              rect.width,
              rect.height,
              p,
              it,
            );
            document
              .querySelectorAll(".escher-control")
              .forEach((el) => (el.style.display = "none"));
            this.announcer.textContent = "Penrose tiling visualization loaded.";
          } else {
            const ty = Sanitizer.int(
              document.getElementById("tilingTypeControl").value,
              1,
              20,
              1,
            );
            const pa = Sanitizer.number(
              document.getElementById("param1Control").value,
              0,
              1,
              0.3,
            );
            this.vis = new EscherPattern(
              this.ctx,
              rect.width,
              rect.height,
              p,
              it,
              ty,
              pa,
            );
            document
              .querySelectorAll(".escher-control")
              .forEach((el) => (el.style.display = "flex"));
            this.announcer.textContent = "Escher pattern visualization loaded.";
          }
          this.render();
        }
        sync() {
          if (!this.vis) return;
          this.vis.palette = this.getPalette(
            document.getElementById("colorSchemeControl").value,
          );
          this.vis.iterations = Sanitizer.int(
            document.getElementById("iterationsControl").value,
            0,
            5,
            3,
          );
          if (this.vis instanceof EscherPattern) {
            this.vis.type = Sanitizer.int(
              document.getElementById("tilingTypeControl").value,
              1,
              20,
              1,
            );
            this.vis.param = Sanitizer.number(
              document.getElementById("param1Control").value,
              0,
              1,
              0.3,
            );
          } else if (this.vis instanceof PenroseTiling) {
            this.vis.generate();
          }
          this.render();
        }
        toggleAnimate() {
          this.active = !this.active;
          const btn = document.getElementById("btnAnimate");
          btn.textContent = this.active ? "Stop Animation" : "Start Animation";
          btn.setAttribute("aria-pressed", this.active.toString());
          this.announcer.textContent = this.active
            ? "Animation started."
            : "Animation stopped.";
          if (this.active) {
            this.lastTime = performance.now();
            this.animFrame = requestAnimationFrame((t) => this.loop(t));
          } else if (this.animFrame) {
            cancelAnimationFrame(this.animFrame);
          }
        }
        loop(t) {
          if (!this.active) return;
          const dt = Math.min((t - this.lastTime) / 1000, 0.1);
          this.lastTime = t;
          this.vis.update(dt);
          this.render();
          this.animFrame = requestAnimationFrame((t) => this.loop(t));
        }
        render() {
          if (this.vis) {
            this.vis.render();
          } else {
            this.ctx.fillStyle = this.palettes.default.bg;
            this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
          }
        }
      }
      window.addEventListener("DOMContentLoaded", () => new Engine());
    </script>
  </body>
</html>
